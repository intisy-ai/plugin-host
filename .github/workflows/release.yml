# Generated by npm-dual-publish. Edit the template, not this file.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote, test and publish; empty takes the ref the run was started from'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'
      - 'gh-v*'

permissions:
  contents: write
  id-token: write

jobs:
  merge:
    if: ${{ !startsWith(inputs.tag || github.ref_name, 'gh-v') }}
    uses: intisy/workflows/.github/workflows/merge.yml@main
    with:
      source: experimental
      target: main
      sync_back: true
      generated_paths: 'README.md'

  test:
    needs: merge
    if: ${{ always() && needs.merge.result != 'failure' && needs.merge.result != 'cancelled' }}
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      ref: ${{ inputs.tag }}

  publish:
    needs: test
    uses: intisy/workflows/.github/workflows/publish.yml@main
    with:
      tag: ${{ inputs.tag }}
      patch_ceiling: 20
      require_clean_readme: true
      unscoped_name: 'plugin-host'
      scope: 'intisy-ai'
      pin_file_deps: true
      targets: ${{ startsWith(inputs.tag || github.ref_name, 'gh-v') && 'none' || '' }}
      prerelease: ${{ startsWith(inputs.tag || github.ref_name, 'gh-v') }}
      npm_pack: ${{ startsWith(inputs.tag || github.ref_name, 'gh-v') }}
      generate_release_notes: ${{ startsWith(inputs.tag || github.ref_name, 'gh-v') }}
      release_assets: ${{ startsWith(inputs.tag || github.ref_name, 'gh-v') && 'release-asset/*.tgz' || '' }}
